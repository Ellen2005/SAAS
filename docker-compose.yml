version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=docker
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m uvicorn api.main:app 
      --host 0.0.0.0 --port 8000 
      --log-level info"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - saas-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas-frontend
    ports:
      - "5000:5000"
    environment:
      - VITE_API_URL=http://backend:8000
      - ENVIRONMENT=docker
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - saas-network

  redis:
    image: redis:7-alpine
    container_name: saas-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - saas-network
    volumes:
      - redis-data:/data

networks:
  saas-network:
    driver: bridge

volumes:
  redis-data:
