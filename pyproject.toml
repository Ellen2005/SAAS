[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartanalytics-saas"
version = "1.0.0"
description = "Smart Analytics SaaS Platform - Data Pipeline & Insights Engine"
requires-python = ">=3.11"
dependencies = [
    "apscheduler==3.10.4",
    "cryptography>=47.0.0",
    "fastapi==0.109.2",
    "groq==0.4.2",
    "httpx>=0.24,<1.0",
    "pandas==2.2.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.6.1",
    "pymongo==4.6.1",
    "pymysql>=1.1.2",
    "python-dotenv==1.0.1",
    "scikit-learn==1.4.0",
    "sib-api-v3-sdk==7.6.0",
    "sqlalchemy==2.0.25",
    "supabase==2.3.4",
    "uvicorn==0.27.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: integration tests requiring external services",
    "unit: unit tests",
    "slow: slow tests",
]

[tool.setuptools]
packages = ["backend"]

[tool.setuptools.package-data]
backend = ["**/*.py", "**/*.sql"]
