version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cnps-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=warning
      - REDIS_URL=redis://redis:6379/0
    command: >
      sh -c "python -m uvicorn api.main:app 
      --host 0.0.0.0 --port 8000 
      --log-level warning
      --workers 4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - saas-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cnps-frontend
    ports:
      - "80:5000"
    environment:
      - VITE_API_URL=http://backend:8000
      - ENVIRONMENT=production
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - saas-network

  redis:
    image: redis:7-alpine
    container_name: cnps-redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - saas-network
    volumes:
      - redis-data:/data

networks:
  saas-network:
    driver: bridge

volumes:
  redis-data:
